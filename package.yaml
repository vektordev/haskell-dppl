name:                haskell-dppl
version:             0.1.0.0
github:              "Github username here/haskell-dppl"
license:             BSD3
author:              "Author name here"
maintainer:          "Author email here"
copyright:           "2019 Author name here"

extra-source-files:
- README.md
- ChangeLog.md

# Metadata used when publishing your package
# synopsis:            Short description of your package
# category:            App category here

# To avoid duplicated efforts in documentation and dealing with the
# complications of embedding Haddock markup inside cabal files, it is
# common to point users to the README.md file.
description:         Please see the README on GitHub at <https://github.com/vektordev/haskell-dppl#readme>

dependencies:
- base >= 4.7 && < 5
- ad
- linear
- random
- MonadRandom
- mtl
- reflection
- containers
- pretty
- text
- megaparsec
- repline
- statistics
- mwc-random
- time
- vector
- QuickCheck
- pretty-simple
- erf
- lens
- optparse-applicative
- parser-combinators
- directory
- filepath
- process

library:
  source-dirs: src
  # The warning-cleanup backlog is empty: src/ and app/ build with zero
  # warnings under this block, so it is -Werror. There are no -Wno-* here and
  # none may be added -- fix the code, or (for a genuine false positive) scope
  # an OPTIONS_GHC pragma to the one module and say why.
  ghc-options:
  - -Wall
  - -Wcompat
  - -Wincomplete-record-updates
  - -Wredundant-constraints
  - -Werror

executables:
  haskell-dppl-exe:
    main:                Main.hs
    source-dirs:         app
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    - -Wall
    - -Wcompat
    - -Wincomplete-record-updates
    - -Wredundant-constraints
    - -Werror
    dependencies:
    - haskell-dppl

tests:
  haskell-dppl-test:
    main:                Spec.hs
    source-dirs:         test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    - -Wall
    - -Wcompat
    - -Wincomplete-record-updates
    - -Wredundant-constraints
    - -Werror
    dependencies:
    - haskell-dppl
    - tasty
    - tasty-hunit
    - tasty-quickcheck
    - temporary
  # The Corpus tasty group, split into its own executable/process so its
  # ~8x-duplicated full-corpus compile isn't held resident (via tasty's own
  # TestTree retention) for the rest of a combined `stack test` run -- see
  # TestCorpus's module haddock. `stack test` runs this alongside
  # haskell-dppl-test automatically, each its own process.
  haskell-dppl-test-corpus:
    main:                SpecCorpus.hs
    source-dirs:
    - test-corpus
    - test
    # Explicit, rather than hpack's directory-scan default: source-dirs
    # includes test/, which also holds haskell-dppl-test's own Spec.hs
    # (module Main) -- auto-discovery would pull that in as a bogus
    # other-module and collide with this stanza's own Main (SpecCorpus.hs).
    # This lists exactly TestCorpus's own transitive test-local dependencies.
    other-modules:
    - TestCorpus
    - TestSupport
    - TestCaseParser
    - End2EndTesting
    - TestTolerances
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    - -Wall
    - -Wcompat
    - -Wincomplete-record-updates
    - -Wredundant-constraints
    - -Werror
    dependencies:
    - haskell-dppl
    - tasty
    - tasty-hunit
    - tasty-quickcheck
    - temporary
