name:                haskell-dppl
version:             0.1.0.0
github:              "Github username here/haskell-dppl"
license:             BSD3
author:              "Author name here"
maintainer:          "Author email here"
copyright:           "2019 Author name here"

extra-source-files:
- README.md
- ChangeLog.md

# Metadata used when publishing your package
# synopsis:            Short description of your package
# category:            App category here

# To avoid duplicated efforts in documentation and dealing with the
# complications of embedding Haddock markup inside cabal files, it is
# common to point users to the README.md file.
description:         Please see the README on GitHub at <https://github.com/vektordev/haskell-dppl#readme>

dependencies:
- base >= 4.7 && < 5
- ad
- linear
- random
- MonadRandom
- mtl
- reflection
- containers
- pretty
- text
- megaparsec
- repline
- statistics
- mwc-random
- time
- vector
- QuickCheck
- pretty-simple
- erf
- lens
- optparse-applicative
- parser-combinators
- directory
- filepath
- process

library:
  source-dirs: src
  # Warning cleanup is staged. Everything -Wall enables outside the -Wno-* list
  # below is clean in src/ today; the -Wno-* list is the remaining backlog.
  # Retire those one at a time, then swap the whole block for `-Wall -Werror`.
  # Do not add a -Wno-* to silence new code.
  #
  # -Woverlapping-patterns (3) and -Wdeprecations (2) still fire and are meant
  # to: they are default-on and each one flags real dead code.
  ghc-options:
  - -Wall
  - -Wcompat
  - -Wincomplete-record-updates
  - -Wredundant-constraints
  # Backlog, with the count at the time this block landed:
  - -Wno-incomplete-uni-patterns   # 71
  - -Wno-incomplete-patterns       # 28
  - -Wno-unused-top-binds          #  5
  - -Wno-type-defaults             #  2

executables:
  haskell-dppl-exe:
    main:                Main.hs
    source-dirs:         app
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    - -Wall
    - -Wcompat
    - -Wincomplete-record-updates
    - -Wredundant-constraints
    - -Wno-incomplete-uni-patterns
    - -Wno-incomplete-patterns
    - -Wno-unused-top-binds
    - -Wno-type-defaults
    dependencies:
    - haskell-dppl

tests:
  haskell-dppl-test:
    # No -Wall yet: test/ has not had the cleanup pass the library has
    # (~300 warnings, mostly -Wname-shadowing and -Wunused-imports).
    main:                Spec.hs
    source-dirs:         test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - haskell-dppl
    - tasty
    - tasty-hunit
    - tasty-quickcheck
    - temporary
